# NOT TESTED: Docker unavailable in the build environment.
services:
  optimizer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      GATEWAY_MODE: demo
      DATA_DIR: /app/data
    volumes:
      - optimizer-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  optimizer-data:
