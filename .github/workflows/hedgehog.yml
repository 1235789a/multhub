name: Hedgehog Lab MVP
on:
  push:
    branches: ["feature/hedgehog-viral-engine-mvp"]
  pull_request:
    paths:
      - "app/**"
      - "public/hedgehog-canonical.png"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/hedgehog.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/hedgehog.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
