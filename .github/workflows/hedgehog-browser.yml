name: Hedgehog browser PNG smoke
on:
  push:
    branches: [feat/hedgehog-viral-engine-v1]
  workflow_dispatch:
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install smoke-test browser without changing repository lockfile
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Start vinext development preview
        run: |
          npm run dev -- --host localhost --port 3000 > /tmp/hedgehog-vinext.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hedgehog-vinext.log
          exit 1
      - name: Click through mobile scan flow and inspect downloaded PNG bytes
        run: node tests/hedgehog.browser.mjs

      - name: Save mobile preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hedgehog-mobile-preview
          path: hedgehog-mobile-preview.png
          if-no-files-found: ignore
